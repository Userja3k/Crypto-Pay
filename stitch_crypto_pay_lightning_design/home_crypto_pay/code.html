<script>
        // Micro-interaction for the histogram hover
        const bars = document.querySelectorAll('.h-24 > div');
        bars.forEach(bar => {
            bar.addEventListener('mouseenter', () => {
                bar.style.transition = 'height 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            });
        });

        // Add visual feedback on glass card movements
        const card = document.querySelector('.liquid-glass');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            // Only apply a subtle parallax to the main card if it's visible
            if (card) {
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
    </script>
