<body class="min-h-screen flex flex-col items-center">

</div>
<div class="absolute bottom-1 right-1 bg-secondary text-on-secondary px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-lg">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified</span>
                    Niveau 3
                </div>
</div>
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg text-primary mb-1">Jean</h2>
<div class="flex items-center justify-center gap-2">
<span class="font-mono-data text-on-surface-variant tracking-wider uppercase">CP-587491</span>
<button class="text-on-surface-variant hover:text-primary transition-colors">

<nav class="flex flex-col">
<!-- Modifier Profil -->
<button class="flex items-center justify-between p-stack-md hover:bg-white/5 transition-colors border-b border-white/5 active:scale-[0.98] transition-transform">

<span class="material-symbols-outlined" data-icon="payments">payments</span>

<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button, a').forEach(elem => {
            elem.addEventListener('touchstart', () => {
                elem.style.transform = 'scale(0.95)';
            });
            elem.addEventListener('touchend', () => {
                elem.style.transform = '';
            });
        });

        // Add subtle parallax to profile glow
        window.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.bg-secondary\\/20');
            if (glow) {
                const moveX = (e.clientX - window.innerWidth / 2) / 40;
                const moveY = (e.clientY - window.innerHeight / 2) / 40;
                glow.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
</body></html>
