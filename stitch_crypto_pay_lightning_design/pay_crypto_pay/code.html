<style>
        body {
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }
        .liquid-glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .scanner-frame {
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6);
        }
        .nfc-wave {
            animation: wave 3s infinite linear;
        }
        @keyframes wave {
            0% { transform: scale(0.8); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .scanning-line {
            animation: scan 2.5s infinite ease-in-out;
        }
        @keyframes scan {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(240px); }
        }
        .bluetooth-pulse {
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>

<script>
        // Micro-interaction for the search icon specifically
        const searchBtn = document.querySelector('[data-icon="search"]').parentElement;
        searchBtn.addEventListener('click', (e) => {
            e.preventDefault();
            // Pulse effect on click
            searchBtn.classList.add('scale-95');
            setTimeout(() => searchBtn.classList.remove('scale-95'), 150);
        });

        // Simple mock scan success detection
