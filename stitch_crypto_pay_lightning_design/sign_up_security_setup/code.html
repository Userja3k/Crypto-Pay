<style>

</div>
<!-- Touch ID Card -->

<div class="w-2.5 h-2.5 rounded-full bg-white/20" id="dot-2"></div>
</div>
<div class="w-12 h-16 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center transition-all duration-300 overflow-hidden">
<div class="w-2.5 h-2.5 rounded-full bg-white/20" id="dot-3"></div>
</div>
<div class="w-12 h-16 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center transition-all duration-300 overflow-hidden">
<div class="w-2.5 h-2.5 rounded-full bg-white/20" id="dot-4"></div>

<div class="w-12 h-16 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center transition-all duration-300 overflow-hidden">

<div class="w-12 h-16 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center transition-all duration-300 overflow-hidden">

<span class="material-symbols-outlined" data-icon="backspace">backspace</span>

<!-- Security Visualization -->
<section class="glass-tile liquid-border p-4 rounded-lg flex items-center gap-4 bg-secondary/5 border-secondary/20">
<div class="relative w-12 h-12 flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full transform -rotate-90">

        Continuer

<div class="fixed top-[-10%] right-[-20%] w-[300px] h-[300px] bg-secondary/10 blur-[120px] rounded-full pointer-events-none -z-10"></div>
<div class="fixed bottom-[10%] left-[-20%] w-[250px] h-[250px] bg-primary/5 blur-[100px] rounded-full pointer-events-none -z-10"></div>
</main>
<script>
    let currentPin = "";
    const maxPin = 6;

    function addPin(num) {
      if (currentPin.length < maxPin) {
        currentPin += num;
        updatePinDisplay();
      }
    }

    function backspace() {
      if (currentPin.length > 0) {
        currentPin = currentPin.slice(0, -1);
        updatePinDisplay();
      }
    }

    function updatePinDisplay() {
      for (let i = 1; i <= maxPin; i++) {
        const dot = document.getElementById(`dot-${i}`);
        const parent = dot.parentElement;
        if (i <= currentPin.length) {
          dot.classList.add('dot-active');
          dot.classList.remove('bg-white/20');
          parent.classList.add('bg-white/15', 'border-white/30', 'scale-105');
        } else {
          dot.classList.remove('dot-active');
          dot.classList.add('bg-white/20');
          parent.classList.remove('bg-white/15', 'border-white/30', 'scale-105');
        }
      }

      // Security progress ring interaction
      const progressCircle = document.getElementById('security-progress');
      const circumference = 2 * Math.PI * 20;
      const offset = circumference - (currentPin.length / maxPin) * circumference;
      progressCircle.style.strokeDashoffset = offset;
    }

    // Initial state
    window.onload = () => {
      // Small animation delay for security circle
      setTimeout(() => {
        const progressCircle = document.getElementById('security-progress');
        progressCircle.style.strokeDashoffset = "94.2"; // ~25% initial
      }, 500);
    };
  </script>
